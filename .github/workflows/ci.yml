name: CI

# Fast feedback for every push and pull request: typecheck the whole tree
# (including the renderer), run the full electron-vite build, then the unit
# test suite. Heavy per-OS packaging stays in build.yml.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Full pipeline: `tsc -p tsconfig.json` typechecks CLI, Electron main and
      # renderer sources, then electron-vite bundles main/preload/renderer.
      - name: Build (tsc + electron-vite)
        run: npm run build

      # Compile before testing: dist/ is gitignored, and `node --test` exits 0
      # on an unmatched glob, so testing before building silently runs nothing.
      - name: Unit tests
        run: npm test

      - name: Smoke test the CLI
        run: |
          SECTL_WORKSPACE="$(mktemp -d)/workspace" node dist/index.js init
          SECTL_WORKSPACE="$(mktemp -d)/workspace" node dist/index.js doctor
